[project]
name = "my-coding-agent"
version = "0.1.0"
description = "Local coding agent with tools, memory, subagents and visual TUI"
requires-python = ">=3.11"
dependencies = [
    "my-agent-core",
    "my-agent-llm",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
my-coding-agent = "my_coding_agent.cli:main"

[tool.uv.sources]
my-agent-core = { path = "../my-agent-core" }
my-agent-llm = { path = "../my-agent-llm" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_coding_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]