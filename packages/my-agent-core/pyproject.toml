[project]
name = "my-agent-core"
version = "0.1.0"
description = "Focused tool-calling agent core with context, memory and subagents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "my-agent-llm",
]

[tool.uv.sources]
my-agent-llm = { path = "../my-agent-llm" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_agent_core"]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
